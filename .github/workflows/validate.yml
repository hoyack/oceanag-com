name: Validate site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate
      - run: npm run test:static
      - run: npm run serve > /tmp/oceanag-http.log 2>&1 &
      - run: for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ && exit 0; sleep 1; done; exit 1
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
